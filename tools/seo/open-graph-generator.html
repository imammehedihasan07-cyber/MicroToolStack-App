<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Graph Meta Tag Generator & Preview | MicroToolStack</title>
  <meta name="description" content="Generate Open Graph (og:) tags for Facebook and Twitter social media cards.">
  
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/tools.css">
</head>
<body>
  <div id="header-container"></div>

  <main class="container">
    <nav class="breadcrumb-container" aria-label="Breadcrumb">
      <ol class="breadcrumb-list">
        <li class="breadcrumb-item"><a href="/">Home</a></li>
        <li class="breadcrumb-item"><a href="/#seo">SEO Tools</a></li>
        <li class="breadcrumb-item active" aria-current="page">Open Graph Generator</li>
      </ol>
    </nav>

    <header style="margin-bottom: 1.5rem;">
      <h1>Open Graph Meta Tag Generator</h1>
      <p>Generate social meta tags so your links display rich previews when shared on Facebook and Twitter.</p>
    </header>

    <div class="tool-layout">
      <div class="tool-container">
        <div style="margin-bottom: 1rem;">
          <label style="font-weight: 600; display: block; margin-bottom: 0.25rem;">Title:</label>
          <input type="text" id="og-title" class="search-input" placeholder="MicroToolStack - Free Fast Web Tools">
        </div>

        <div style="margin-bottom: 1rem;">
          <label style="font-weight: 600; display: block; margin-bottom: 0.25rem;">Description:</label>
          <input type="text" id="og-desc" class="search-input" placeholder="Clean, fast online utilities for creators...">
        </div>

        <div style="margin-bottom: 1rem;">
          <label style="font-weight: 600; display: block; margin-bottom: 0.25rem;">Site URL:</label>
          <input type="url" id="og-url" class="search-input" placeholder="https://microtoolstack.com">
        </div>

        <label style="font-weight: 600; display: block; margin-bottom: 0.5rem;">Generated Meta HTML Code:</label>
        <textarea id="og-output" class="tool-textarea" readonly style="font-family: var(--font-mono); font-size: 0.85rem; min-height: 140px;"></textarea>

        <div class="tool-controls" style="margin-top: 1rem;">
          <button class="btn btn-primary" data-copy-target="og-output">📋 Copy Meta Tags</button>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const title = document.getElementById('og-title');
      const desc = document.getElementById('og-desc');
      const url = document.getElementById('og-url');
      const output = document.getElementById('og-output');

      function generateOG() {
        const t = title.value || 'Page Title';
        const d = desc.value || 'Page description goes here...';
        const u = url.value || 'https://example.com';

        output.value = `<!-- Open Graph / Facebook -->\n<meta property="og:type" content="website">\n<meta property="og:url" content="${u}">\n<meta property="og:title" content="${t}">\n<meta property="og:description" content="${d}">\n\n<!-- Twitter -->\n<meta property="twitter:card" content="summary_large_image">\n<meta property="twitter:url" content="${u}">\n<meta property="twitter:title" content="${t}">\n<meta property="twitter:description" content="${d}">`;
      }

      title.addEventListener('input', generateOG);
      desc.addEventListener('input', generateOG);
      url.addEventListener('input', generateOG);
      generateOG();
    });
  </script>
</body>
</html>
