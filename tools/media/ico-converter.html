<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        var gTagScript = document.createElement('script');
        gTagScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-F3WWR9KGB4';
        gTagScript.async = true;
        document.head.appendChild(gTagScript);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-F3WWR9KGB4');
      }, 1000);
    });
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PNG/JPG to ICO Converter - Free Online Tool | MicroToolStack</title>
  <meta name="description" content="Convert PNG, JPG, and WebP images to .ico format for websites and apps online for free. 100% private client-side conversion.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/assets/css/style.css?v=10.0">
  <link rel="stylesheet" href="/assets/css/components.css?v=10.0">

  <style>
    .upload-box {
      border: 2px dashed var(--border-color);
      padding: 2.5rem 1.5rem;
      text-align: center;
      border-radius: 12px;
      cursor: pointer;
      background: var(--bg-secondary);
      margin-bottom: 1.5rem;
    }
    .preview-container { margin-top: 1.5rem; display: none; text-align: center; }
    .size-select {
      padding: 0.6rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
      color: var(--text-primary);
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div id="header-container"></div>

  <main class="container" style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
    <nav style="font-size: 0.85rem; margin-bottom: 1rem; color: var(--text-secondary);">
      <a href="/" style="color: var(--text-primary); text-decoration: none;">Home</a> / 
      <a href="/tools/media/" style="color: var(--text-primary); text-decoration: none;">Media Tools</a> / 
      <span>ICO Converter</span>
    </nav>

    <header style="margin-bottom: 2rem; text-align: center;">
      <h1 class="hero" style="font-size: 2.2rem; margin-bottom: 0.5rem;">Free Online ICO Converter</h1>
      <p style="color: var(--text-secondary); font-size: 1rem;">Convert PNG, JPG, or WebP images into ICO format for favicons and desktop icons.</p>
    </header>

    <div class="card" style="padding: 2rem; border-radius: 12px; background: var(--bg-secondary); border: 1px solid var(--border-color);">
      <div class="upload-box" id="dropZone" onclick="document.getElementById('imageInput').click()">
        <span style="font-size: 2.5rem; display: block; margin-bottom: 0.5rem;">📦</span>
        <p style="margin-bottom: 0.5rem; font-weight: 600; color: var(--text-primary);">Click or Drag & Drop Image Here</p>
        <p style="font-size: 0.85rem; color: var(--text-secondary);">Supports PNG, JPG, WebP (100% Client-Side Processing)</p>
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
      </div>

      <div class="preview-container" id="previewArea">
        <div style="margin-bottom: 1rem;">
          <img id="previewImg" style="max-height: 150px; border-radius: 8px; border: 1px solid var(--border-color);" alt="ICO Preview">
        </div>

        <label style="display: block; font-size: 0.9rem; margin-bottom: 0.5rem; color: var(--text-secondary);">Select Target Icon Size:</label>
        <select id="icoSize" class="size-select" onchange="renderIco()">
          <option value="16">16x16 (Favicon Small)</option>
          <option value="32" selected>32x32 (Favicon Standard)</option>
          <option value="48">48x48 (Desktop Shortcut)</option>
          <option value="64">64x64 (High Resolution)</option>
          <option value="128">128x128 (App Icon)</option>
        </select>

        <br>
        <button class="btn btn-primary" style="padding: 0.8rem 2rem; font-size: 1rem; cursor: pointer;" onclick="downloadICO()">⬇️ Download .ICO File</button>
      </div>
    </div>
  </main>

  <canvas id="icoCanvas" style="display: none;"></canvas>
  <div id="footer-container"></div>

  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/utils.js" defer></script>
  <script src="/assets/js/search.js" defer></script>
  <script src="/assets/js/app.js" defer></script>

  <script>
    let uploadedImage = null;
    let originalFileName = 'favicon';

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if(!file) return;

      originalFileName = file.name.replace(/\.[^/.]+$/, "");
      const reader = new FileReader();
      reader.onload = function(evt) {
        uploadedImage = new Image();
        uploadedImage.onload = function() {
          renderIco();
          document.getElementById('previewArea').style.display = 'block';
        };
        uploadedImage.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function renderIco() {
      if(!uploadedImage) return;
      const size = parseInt(document.getElementById('icoSize').value);
      const canvas = document.getElementById('icoCanvas');
      canvas.width = size;
      canvas.height = size;

      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, size, size);
      ctx.drawImage(uploadedImage, 0, 0, size, size);

      document.getElementById('previewImg').src = canvas.toDataURL('image/png');
    }

    function downloadICO() {
      const canvas = document.getElementById('icoCanvas');
      const link = document.createElement('a');
      link.download = `${originalFileName}.ico`;
      link.href = canvas.toDataURL('image/x-icon');
      link.click();
    }
  </script>
</body>
</html>
