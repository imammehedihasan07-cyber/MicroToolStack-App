<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Converter & Compressor | MicroToolStack</title>
  <meta name="description" content="Convert JPG/PNG images to WebP format and compress file sizes 100% in your browser.">
  
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/tools.css">
</head>
<body>
  <div id="header-container"></div>

  <main class="container">
    <nav class="breadcrumb-container" aria-label="Breadcrumb">
      <ol class="breadcrumb-list">
        <li class="breadcrumb-item"><a href="/">Home</a></li>
        <li class="breadcrumb-item"><a href="/#media">Media Tools</a></li>
        <li class="breadcrumb-item active" aria-current="page">Image Converter</li>
      </ol>
    </nav>

    <header style="margin-bottom: 1.5rem;">
      <h1>Image Converter & Compressor</h1>
      <p>Convert images to WebP, PNG, or JPG formats and compress quality safely in your browser.</p>
    </header>

    <div class="tool-layout">
      <div class="tool-container">
        <input type="file" id="image-input" accept="image/*" class="search-input" style="margin-bottom: 1rem;">

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1rem;">
          <div>
            <label style="font-weight: 600; display: block; margin-bottom: 0.5rem;">Target Format:</label>
            <select id="format-select" class="search-input">
              <option value="image/webp">WebP (Best for Web)</option>
              <option value="image/jpeg">JPEG / JPG</option>
              <option value="image/png">PNG</option>
            </select>
          </div>
          <div>
            <label style="font-weight: 600; display: block; margin-bottom: 0.5rem;">Quality (0.1 - 1.0):</label>
            <input type="number" id="quality-input" class="search-input" value="0.8" min="0.1" max="1.0" step="0.1">
          </div>
        </div>

        <button class="btn btn-primary" id="btn-convert" style="width: 100%; margin-bottom: 1.5rem;">🖼️ Convert & Compress</button>

        <div id="preview-area" style="display: none; text-align: center;">
          <img id="converted-img" style="max-width: 100%; border-radius: var(--radius-md); border: 1px solid var(--border-color); margin-bottom: 1rem;" alt="Converted Image Output">
          <br>
          <a id="download-link" class="btn btn-primary" download="converted-image.webp">📥 Download Converted Image</a>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const imgInput = document.getElementById('image-input');
      const formatSelect = document.getElementById('format-select');
      const qualityInput = document.getElementById('quality-input');
      const previewArea = document.getElementById('preview-area');
      const convertedImg = document.getElementById('converted-img');
      const downloadLink = document.getElementById('download-link');

      document.getElementById('btn-convert').addEventListener('click', () => {
        const file = imgInput.files[0];
        if (!file) {
          showToast('Please select an image file first.', 'danger');
          return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            const format = formatSelect.value;
            const quality = parseFloat(qualityInput.value) || 0.8;

            const dataUrl = canvas.toDataURL(format, quality);
            convertedImg.src = dataUrl;
            downloadLink.href = dataUrl;

            const ext = format.split('/')[1];
            downloadLink.download = `microtoolstack-converted.${ext}`;

            previewArea.style.display = 'block';
            showToast('Image converted successfully!');
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    });
  </script>
</body>
</html>
