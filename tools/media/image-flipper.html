<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        var gTagScript = document.createElement('script');
        gTagScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-F3WWR9KGB4';
        gTagScript.async = true;
        document.head.appendChild(gTagScript);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-F3WWR9KGB4');
      }, 1000);
    });
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Flipper - Flip Images Horizontally & Vertically | MicroToolStack</title>
  <meta name="description" content="Flip images horizontally (mirror effect) or vertically online for free. Private, instant, client-side browser image flipper.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/assets/css/style.css?v=10.0">
  <link rel="stylesheet" href="/assets/css/components.css?v=10.0">

  <style>
    .upload-box {
      border: 2px dashed var(--border-color);
      padding: 2.5rem 1.5rem;
      text-align: center;
      border-radius: 12px;
      cursor: pointer;
      background: var(--bg-secondary);
      margin-bottom: 1.5rem;
    }
    .preview-container { margin-top: 1.5rem; display: none; text-align: center; }
    .img-preview { max-width: 100%; max-height: 350px; border-radius: 8px; transition: transform 0.3s ease; }
    .btn-group { display: flex; gap: 0.8rem; justify-content: center; margin: 1.5rem 0; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div id="header-container"></div>

  <main class="container" style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
    <nav style="font-size: 0.85rem; margin-bottom: 1rem; color: var(--text-secondary);">
      <a href="/" style="color: var(--text-primary); text-decoration: none;">Home</a> / 
      <a href="/tools/media/" style="color: var(--text-primary); text-decoration: none;">Media Tools</a> / 
      <span>Image Flipper</span>
    </nav>

    <header style="margin-bottom: 2rem; text-align: center;">
      <h1 class="hero" style="font-size: 2.2rem; margin-bottom: 0.5rem;">Free Online Image Flipper</h1>
      <p style="color: var(--text-secondary); font-size: 1rem;">Flip images horizontally (mirror) or vertically instantly inside your browser.</p>
    </header>

    <div class="card" style="padding: 2rem; border-radius: 12px; background: var(--bg-secondary); border: 1px solid var(--border-color);">
      <div class="upload-box" id="dropZone" onclick="document.getElementById('imageInput').click()">
        <span style="font-size: 2.5rem; display: block; margin-bottom: 0.5rem;">🪞</span>
        <p style="margin-bottom: 0.5rem; font-weight: 600; color: var(--text-primary);">Click or Drag & Drop Image Here</p>
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
      </div>

      <div class="preview-container" id="previewArea">
        <div style="overflow: hidden; padding: 1rem;">
          <img id="previewImg" class="img-preview" alt="Flipped Image Preview">
        </div>

        <div class="btn-group">
          <button class="btn btn-secondary" onclick="toggleFlip('h')" style="cursor:pointer; background:var(--bg-primary); border:1px solid var(--border-color); color:var(--text-primary);">↔️ Flip Horizontally</button>
          <button class="btn btn-secondary" onclick="toggleFlip('v')" style="cursor:pointer; background:var(--bg-primary); border:1px solid var(--border-color); color:var(--text-primary);">↕️ Flip Vertically</button>
        </div>

        <button class="btn btn-primary" style="padding: 0.8rem 2rem; font-size: 1rem; cursor: pointer;" onclick="downloadFlippedImage()">⬇️ Download Flipped Image</button>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/utils.js" defer></script>
  <script src="/assets/js/search.js" defer></script>
  <script src="/assets/js/app.js" defer></script>

  <script>
    let flipH = false;
    let flipV = false;
    let originalImage = null;
    let originalFileName = 'flipped-image';

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if(!file) return;
      originalFileName = file.name.replace(/\.[^/.]+$/, "");
      const reader = new FileReader();
      reader.onload = function(evt) {
        originalImage = new Image();
        originalImage.onload = function() {
          flipH = false;
          flipV = false;
          updatePreview();
          document.getElementById('previewArea').style.display = 'block';
        };
        originalImage.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function toggleFlip(dir) {
      if(dir === 'h') flipH = !flipH;
      if(dir === 'v') flipV = !flipV;
      updatePreview();
    }

    function updatePreview() {
      const img = document.getElementById('previewImg');
      const scaleX = flipH ? -1 : 1;
      const scaleY = flipV ? -1 : 1;
      img.style.transform = `scale(${scaleX}, ${scaleY})`;
    }

    function downloadFlippedImage() {
      if(!originalImage) return;
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      canvas.width = originalImage.width;
      canvas.height = originalImage.height;

      ctx.translate(flipH ? canvas.width : 0, flipV ? canvas.height : 0);
      ctx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
      ctx.drawImage(originalImage, 0, 0);

      const link = document.createElement('a');
      link.download = `${originalFileName}-flipped.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
