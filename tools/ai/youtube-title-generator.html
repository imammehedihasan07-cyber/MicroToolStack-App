<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI YouTube Metadata Generator - MicroToolStack</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <style>
    .card {
      max-width: 800px;
      margin: 20px auto;
      padding: 24px;
      background: var(--bg-card, #1e1e2e);
      border-radius: 12px;
      border: 1px solid var(--border-color, #333);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    h1 { margin-top: 0; color: #ff0000; font-size: 1.8rem; }
    label { font-weight: bold; display: block; margin-bottom: 8px; }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color, #444);
      border-radius: 8px;
      box-sizing: border-box;
      margin-bottom: 16px;
      background: rgba(0,0,0,0.2);
      color: #fff;
    }
    button {
      background: #ff0000;
      color: white;
      border: none;
      padding: 12px 24px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #cc0000; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .output-box { margin-top: 24px; display: none; }
    .section {
      background: rgba(255, 255, 255, 0.05);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      position: relative;
      border: 1px solid var(--border-color, #333);
    }
    .section h3 { margin-top: 0; font-size: 1.1rem; }
    pre { white-space: pre-wrap; font-family: inherit; margin: 0; }
    .copy-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
    }
    .copy-btn:hover { background: #2563eb; }
  </style>
</head>
<body>

  <div id="header-container"></div>

  <main class="container">
    <div class="card">
      <h1>🎬 AI YouTube Metadata Generator</h1>
      <p style="color: var(--text-muted, #a1a1aa); margin-bottom: 1rem;">Get SEO-optimized Titles, Descriptions, and Hashtags in one click!</p>

      <label for="topic">Video Topic / Main Keyword:</label>
      <input type="text" id="topic" placeholder="e.g., How to build a web app with Vercel and Gemini AI">

      <button id="genBtn" onclick="generateYouTubeMetadata()">Generate Metadata</button>

      <div id="output" class="output-box">
        <!-- Titles Section -->
        <div class="section">
          <h3>📌 Catchy Titles</h3>
          <button class="copy-btn" onclick="copyText('titlesOutput')">Copy</button>
          <pre id="titlesOutput"></pre>
        </div>

        <!-- Description Section -->
        <div class="section">
          <h3>📝 SEO Description</h3>
          <button class="copy-btn" onclick="copyText('descOutput')">Copy</button>
          <pre id="descOutput"></pre>
        </div>

        <!-- Hashtags Section -->
        <div class="section">
          <h3>🏷️ Viral Hashtags</h3>
          <button class="copy-btn" onclick="copyText('tagsOutput')">Copy</button>
          <pre id="tagsOutput"></pre>
        </div>
      </div>
    </div>
  </main>

  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>
    async function generateYouTubeMetadata() {
      const topic = document.getElementById('topic').value.trim();
      const btn = document.getElementById('genBtn');
      const outputBox = document.getElementById('output');

      if (!topic) {
        alert('Please enter a topic!');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Generating with AI...';
      outputBox.style.display = 'none';

      try {
        const response = await fetch('/api/generate-youtube', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic: topic })
        });

        const data = await response.json();

        if (data.error) {
          alert('Error: ' + data.error);
        } else {
          document.getElementById('titlesOutput').innerText = data.titles || 'N/A';
          document.getElementById('descOutput').innerText = data.description || 'N/A';
          document.getElementById('tagsOutput').innerText = data.hashtags || 'N/A';
          outputBox.style.display = 'block';
        }
      } catch (err) {
        alert('Something went wrong. Please check your API key setup in Vercel.');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Generate Metadata';
      }
    }

    function copyText(elementId) {
      const text = document.getElementById(elementId).innerText;
      navigator.clipboard.writeText(text);
      alert('Copied to clipboard!');
    }
  </script>
</body>
</html>
