<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI YouTube Title Generator | MicroToolStack</title>
  <meta name="description" content="Generate high-CTR viral YouTube video title ideas with AI.">
  
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/tools.css">
</head>
<body>
  <div id="header-container"></div>

  <main class="container">
    <nav class="breadcrumb-container" aria-label="Breadcrumb">
      <ol class="breadcrumb-list">
        <li class="breadcrumb-item"><a href="/">Home</a></li>
        <li class="breadcrumb-item"><a href="/#ai">AI Tools</a></li>
        <li class="breadcrumb-item active" aria-current="page">YouTube Title Generator</li>
      </ol>
    </nav>

    <header style="margin-bottom: 1.5rem;">
      <h1>AI YouTube Title Generator</h1>
      <p>Generate high-click-through-rate (CTR) video titles designed for YouTube growth.</p>
    </header>

    <div class="tool-layout">
      <div class="tool-container">
        <label style="font-weight: 600; display: block; margin-bottom: 0.5rem;">What is your video topic about?</label>
        <input type="text" id="ai-input" class="search-input" placeholder="e.g. How to learn JavaScript fast in 2026 for beginners" style="margin-bottom: 1rem;">

        <div class="tool-controls">
          <button class="btn btn-primary" id="btn-generate">🎬 Generate Titles</button>
        </div>

        <label style="font-weight: 600; display: block; margin-top: 1.5rem; margin-bottom: 0.5rem;">Clickable Title Ideas:</label>
        <textarea id="ai-output" class="tool-textarea" style="min-height: 180px;" readonly placeholder="Title ideas will appear here..."></textarea>

        <div class="tool-controls" style="margin-top: 1rem;">
          <button class="btn btn-primary" data-copy-target="ai-output">📋 Copy Titles</button>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('ai-input');
      const output = document.getElementById('ai-output');
      const btn = document.getElementById('btn-generate');

      btn.addEventListener('click', async () => {
        if (!input.value.trim()) return;

        btn.disabled = true;
        btn.textContent = '⏳ Generating...';

        try {
          const prompt = `Generate 10 high CTR viral YouTube video title ideas for this topic: "${input.value}". Make them catchy and action-oriented.`;
          const res = await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt, type: 'youtube' })
          });

          const data = await res.json();
          output.value = res.ok ? data.result : 'Error: ' + data.error;
        } catch (err) {
          output.value = 'Failed to connect to API.';
        } finally {
          btn.disabled = false;
          btn.textContent = '🎬 Generate Titles';
        }
      });
    });
  </script>
</body>
</html>
