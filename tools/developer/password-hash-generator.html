<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password & Hash Generator | MicroToolStack</title>
  <meta name="description" content="Generate random secure passwords and SHA-256 hashes directly in your browser.">
  
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/tools.css">
</head>
<body>
  <div id="header-container"></div>

  <main class="container">
    <nav class="breadcrumb-container" aria-label="Breadcrumb">
      <ol class="breadcrumb-list">
        <li class="breadcrumb-item"><a href="/">Home</a></li>
        <li class="breadcrumb-item"><a href="/#developer">Developer Tools</a></li>
        <li class="breadcrumb-item active" aria-current="page">Password & Hash Generator</li>
      </ol>
    </nav>

    <header style="margin-bottom: 1.5rem;">
      <h1>Password & Hash Generator</h1>
      <p>Generate cryptographically secure passwords and calculate SHA-256 hashes instantly.</p>
    </header>

    <div class="tool-layout">
      <div class="tool-container">
        <!-- Section 1: Password Gen -->
        <h3>🛡️ Strong Password Generator</h3>
        <div style="display: flex; gap: 0.5rem; margin: 1rem 0;">
          <input type="text" id="pass-output" class="search-input" readonly style="font-family: var(--font-mono);" placeholder="Generated password...">
          <button class="btn btn-primary" id="btn-gen-pass">🎲 Generate</button>
        </div>

        <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 2rem;">
          <label style="font-size: 0.875rem;">Length: <strong id="len-val">16</strong></label>
          <input type="range" id="pass-length" min="8" max="64" value="16" style="flex: 1;">
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 1.5rem 0;">

        <!-- Section 2: Hash Gen -->
        <h3>🔑 SHA-256 Hash Generator</h3>
        <input type="text" id="hash-input" class="search-input" placeholder="Type text to convert to SHA-256 hash..." style="margin: 1rem 0;">
        <input type="text" id="hash-output" class="search-input" readonly style="font-family: var(--font-mono);" placeholder="SHA-256 Result...">

        <div class="tool-controls" style="margin-top: 1rem;">
          <button class="btn btn-primary" data-copy-target="hash-output">📋 Copy Hash</button>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Password Generator Logic
      const passOutput = document.getElementById('pass-output');
      const passLen = document.getElementById('pass-length');
      const lenVal = document.getElementById('len-val');

      function generatePassword() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:,.<>?';
        let pass = '';
        const len = parseInt(passLen.value);
        const array = new Uint32Array(len);
        crypto.getRandomValues(array);
        for (let i = 0; i < len; i++) {
          pass += chars[array[i] % chars.length];
        }
        passOutput.value = pass;
      }

      passLen.addEventListener('input', () => {
        lenVal.textContent = passLen.value;
        generatePassword();
      });

      document.getElementById('btn-gen-pass').addEventListener('click', generatePassword);
      generatePassword();

      // SHA-256 Hash Generator Logic
      const hashInput = document.getElementById('hash-input');
      const hashOutput = document.getElementById('hash-output');

      async function calculateHash() {
        const text = hashInput.value;
        if (!text) { hashOutput.value = ''; return; }
        const encoder = new TextEncoder();
        const data = encoder.encode(text);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        hashOutput.value = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      }

      hashInput.addEventListener('input', calculateHash);
    });
  </script>
</body>
</html>
