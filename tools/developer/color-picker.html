<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Picker & Palette Generator | MicroToolStack</title>
  <meta name="description" content="Pick HEX/RGB colors and generate beautiful matching color palettes for web UI.">
  
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/tools.css">
</head>
<body>
  <div id="header-container"></div>

  <main class="container">
    <nav class="breadcrumb-container" aria-label="Breadcrumb">
      <ol class="breadcrumb-list">
        <li class="breadcrumb-item"><a href="/">Home</a></li>
        <li class="breadcrumb-item"><a href="/#developer">Developer Tools</a></li>
        <li class="breadcrumb-item active" aria-current="page">Color Picker</li>
      </ol>
    </nav>

    <header style="margin-bottom: 1.5rem;">
      <h1>Color Picker & Palette Generator</h1>
      <p>Pick custom colors, view HEX/RGB values, and copy UI code instantly.</p>
    </header>

    <div class="tool-layout">
      <div class="tool-container">
        <div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 1.5rem;">
          <input type="color" id="color-input" value="#0066ff" style="width: 80px; height: 80px; border: none; cursor: pointer; border-radius: var(--radius-sm);">
          <div>
            <h3 id="hex-display" style="margin: 0; font-family: var(--font-mono);">#0066ff</h3>
            <p id="rgb-display" style="margin: 0; font-family: var(--font-mono); color: var(--text-muted);">rgb(0, 102, 255)</p>
          </div>
        </div>

        <div class="tool-controls">
          <button class="btn btn-primary" id="btn-copy-hex">📋 Copy HEX</button>
          <button class="btn btn-secondary" id="btn-copy-rgb">📋 Copy RGB</button>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const colorInput = document.getElementById('color-input');
      const hexDisplay = document.getElementById('hex-display');
      const rgbDisplay = document.getElementById('rgb-display');

      function hexToRgb(hex) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgb(${r}, ${g}, ${b})`;
      }

      colorInput.addEventListener('input', () => {
        const hex = colorInput.value;
        const rgb = hexToRgb(hex);
        hexDisplay.textContent = hex;
        rgbDisplay.textContent = rgb;
      });

      document.getElementById('btn-copy-hex').addEventListener('click', () => {
        copyToClipboard(hexDisplay.textContent);
      });

      document.getElementById('btn-copy-rgb').addEventListener('click', () => {
        copyToClipboard(rgbDisplay.textContent);
      });
    });
  </script>
</body>
</html>
