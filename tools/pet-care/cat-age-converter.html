<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Age to Human Age Converter - MicroToolStack</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <style>
    .calculator-card { max-width: 600px; margin: 2rem auto; padding: 2rem; background: var(--bg-card, #1e1e2e); border-radius: 12px; border: 1px solid var(--border-color, #333); }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
    .form-control { width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid var(--border-color, #444); background: rgba(0,0,0,0.2); color: #fff; font-size: 1rem; box-sizing: border-box; }
    .btn-calc { width: 100%; padding: 0.9rem; background: #a855f7; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    .result-box { margin-top: 1.5rem; padding: 1.2rem; border-radius: 8px; text-align: center; display: none; background: rgba(168, 85, 247, 0.1); border: 1px solid #a855f7; }
  </style>
</head>
<body>
  <div id="header-container"></div>
  <main class="container">
    <div class="calculator-card">
      <h1 style="text-align: center; margin-bottom: 1rem;">🐱 Cat Age to Human Age Converter</h1>
      <div class="form-group">
        <label for="catAge">Cat's Age (in years):</label>
        <input type="number" id="catAge" class="form-control" placeholder="e.g. 3" step="0.5">
      </div>
      <button onclick="calculateCatAge()" class="btn-calc">Convert Age</button>
      <div id="resultCat" class="result-box">
        <h3>Equivalent Human Age: <span id="humanYears" style="color:#a855f7;"></span> years old</h3>
      </div>
    </div>
  </main>
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>
    function calculateCatAge() {
      const age = parseFloat(document.getElementById('catAge').value);
      if (isNaN(age) || age < 0) { alert("Please enter a valid age."); return; }
      let humanAge = 0;
      if (age <= 1) { humanAge = age * 15; }
      else if (age <= 2) { humanAge = 15 + ((age - 1) * 9); }
      else { humanAge = 24 + ((age - 2) * 4); }
      document.getElementById('humanYears').innerText = Math.round(humanAge);
      document.getElementById('resultCat').style.display = "block";
    }
  </script>
</body>
</html>
