<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Free Online PDF, SEO, Text & Developer Tools | MicroToolStack</title>
  <meta name="description" content="Free online tools for PDF, text, SEO, developer utilities, image conversion and AI productivity. Fast, secure and privacy-friendly. No signup required.">

  <link rel="canonical" href="https://microtoolstack.com/">
  <meta name="robots" content="index, follow">

  <!-- Favicon Icons -->
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/favicon.png">
  <link rel="apple-touch-icon" href="/assets/images/favicon.png">

  <!-- Preconnect & DNS-Prefetch for Fast Third-Party Connection -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com">

  <!-- Google AdSense (Standard Async - No Artificial Delay) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3023714618008515" crossorigin="anonymous"></script>

  <!-- Schema Markup -->
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"Organization",
    "name":"MicroToolStack",
    "url":"https://microtoolstack.com"
  }
  </script>

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="/assets/css/variables.css?v=10.0">
  <link rel="stylesheet" href="/assets/css/components.css?v=10.0">
  <link rel="stylesheet" href="/assets/css/style.css?v=10.0">

  <style>
    /* Critical CSS to Prevent Layout Shifts (CLS) & Lower LCP */
    .hero {
      text-align: center;
      padding: 4rem 1rem 3rem;
      max-width: 800px;
      margin: 0 auto;
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.25rem);
      letter-spacing: -0.02em;
      min-height: 3.5rem; /* Layout reservation */
    }
    .hero p {
      font-size: 1.125rem;
      margin-bottom: 2rem;
    }
    .search-wrapper {
      max-width: 550px;
      margin: 0 auto 3rem;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 0.875rem 1.25rem;
      font-size: 1rem;
      border: 1px solid var(--border-color, #333);
      border-radius: var(--radius-md, 8px);
      background-color: var(--bg-card, #1e1e2e);
      color: var(--text-primary, #fff);
      outline: none;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.25rem;
      margin-bottom: 3.5rem;
      min-height: 280px; /* Layout reservation */
    }
    .tool-card {
      display: flex;
      flex-direction: column;
      height: 100%;
      text-decoration: none;
      color: inherit;
    }
    .tool-card-icon {
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
    }
    .faq-item {
      background-color: var(--bg-card, #1e1e2e);
      border: 1px solid var(--border-color, #333);
      border-radius: var(--radius-md, 8px);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body style="margin: 0; padding: 0;">

  <!-- Header Container Placeholder -->
  <div id="header-container"></div>

  <!-- Main Body Content -->
  <main class="container">
    <!-- Hero Section -->
    <section class="hero">
      <span class="badge badge-primary" style="margin-bottom: 1rem;">100% Free & Fast</span>
      <h1>Essential Micro-Tools for Digital Creators</h1>
      <p>Clean, private, and ultra-fast web utilities for content, SEO, code, and AI generation.</p>

      <!-- Search Input Container -->
      <div class="search-wrapper">
        <input type="text" id="home-search" class="search-input" placeholder="Search 20+ tools (e.g. Word Counter, JSON, Slug)..." aria-label="Search tools">
        <div id="search-results-dropdown"></div>
      </div>
    </section>

    <!-- Popular Tools Section -->
    <section>
      <div class="section-title">
        <h2>🔥 Popular Tools</h2>
      </div>
      <div class="grid-4" id="popular-tools-grid"></div>
    </section>

    <!-- Categories Section -->
    <section id="categories">
      <div class="section-title">
        <h2>📂 Explore Categories</h2>
      </div>
      <div class="grid-4" id="categories-grid"></div>
    </section>

    <!-- Category Tools Display Section -->
    <section id="category-tools-section" style="display: none; margin-bottom: 3rem;">
      <div class="section-title">
        <h2 id="category-title">Tools</h2>
      </div>
      <div class="grid-4" id="category-tools-grid"></div>
    </section>

    <!-- FAQ Section -->
    <section style="margin-bottom: 4rem;">
      <div class="section-title">
        <h2>❓ Frequently Asked Questions</h2>
      </div>
      <div id="faq-container"></div>
    </section>
  </main>

  <!-- Footer Placeholder -->
  <div id="footer-container"></div>

  <!-- Non-blocking Core Scripts -->
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/utils.js" defer></script>
  <script src="/assets/js/search.js" defer></script>

  <!-- Analytics Deferring Script (Triggers on interaction or 4s timeout) -->
  <script>
    function initAnalytics() {
      if (window.analyticsInitialized) return;
      window.analyticsInitialized = true;

      var gTagScript = document.createElement('script');
      gTagScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-F3WWR9KGB4';
      gTagScript.async = true;
      document.head.appendChild(gTagScript);

      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-F3WWR9KGB4');
    }

    // Load Analytics on User Scroll, Touch, Move OR fallback 4 Seconds
    ['touchstart', 'scroll', 'mousemove', 'keydown'].forEach(function(ev) {
      window.addEventListener(ev, initAnalytics, { passive: true, once: true });
    });
    setTimeout(initAnalytics, 4000);
  </script>

  <!-- Homepage Dynamic Data Loader -->
  <script>
    (async function loadData() {
      try {
        const [toolsRes, catRes, faqRes] = await Promise.all([
          fetch('/data/tools.json'),
          fetch('/data/categories.json'),
          fetch('/data/faqs.json')
        ]);

        const tools = await toolsRes.json();
        const categories = await catRes.json();
        const faqs = await faqRes.json();

        const cleanStr = str => (str || '').toString().toLowerCase().replace(/[^a-z0-9]/g, '');

        // Render Popular Tools
        const popularGrid = document.getElementById('popular-tools-grid');
        if (popularGrid) {
          const popularTools = tools.filter(t => t.isPopular || t.popular || tools.indexOf(t) < 12);
          popularGrid.innerHTML = popularTools.map(tool => `
            <a href="${tool.url}" class="card card-interactive tool-card">
              <div class="tool-card-icon">${tool.icon || '🛠️'}</div>
              <h3>${tool.name}</h3>
              <p>${tool.description}</p>
            </a>
          `).join('');
        }

        // Render Categories
        const catGrid = document.getElementById('categories-grid');
        if (catGrid) {
          catGrid.innerHTML = categories.map(cat => {
            const cleanCatId = cleanStr(cat.id);
            const liveCount = tools.filter(tool => cleanStr(tool.category) === cleanCatId).length;

            return `
              <div class="card card-interactive tool-card" onclick="filterCategory('${cat.id}', '${cat.name}')" style="cursor: pointer;">
                <div class="tool-card-icon">${cat.icon || '📂'}</div>
                <h3>${cat.name}</h3>
                <p>${cat.description || ''}</p>
                <span style="font-size: 0.85rem; color: var(--accent-primary, #3b82f6); font-weight: 600; margin-top: 0.75rem; display: block;">View ${liveCount} →</span>
              </div>
            `;
          }).join('');
        }

        // Global Category Filter
        window.filterCategory = function(catId, catName) {
          const catSection = document.getElementById('category-tools-section');
          const catTitle = document.getElementById('category-title');
          const catToolsGrid = document.getElementById('category-tools-grid');

          const cleanCatId = cleanStr(catId);
          const filteredTools = tools.filter(t => cleanStr(t.category) === cleanCatId);

          if (catTitle) catTitle.textContent = `${catName} (${filteredTools.length})`;
          if (catToolsGrid) {
            catToolsGrid.innerHTML = filteredTools.map(tool => `
              <a href="${tool.url}" class="card card-interactive tool-card">
                <div class="tool-card-icon">${tool.icon || '🛠️'}</div>
                <h3>${tool.name}</h3>
                <p>${tool.description}</p>
              </a>
            `).join('');
          }

          if (catSection) {
            catSection.style.display = 'block';
            catSection.scrollIntoView({ behavior: 'smooth' });
          }
        };

        // Render FAQs
        const faqGrid = document.getElementById('faq-container');
        if (faqGrid) {
          faqGrid.innerHTML = faqs.map(faq => `
            <div class="faq-item">
              <h3>${faq.question || faq.q}</h3>
              <p>${faq.answer || faq.a}</p>
            </div>
          `).join('');
        }
      } catch (err) {
        console.error('Failed to load homepage data:', err);
      }
    })();
  </script>
</body>
</html>
