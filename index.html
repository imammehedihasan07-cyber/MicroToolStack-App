<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MicroToolStack - Free, Fast & Privacy-First Web Utilities</title>
  <meta name="description" content="Discover free online utilities for text processing, SEO optimization, developer tasks, and AI content generation. No sign-up required.">
<meta name="google-site-verification" content="HfvzuzUidPVymGZ1FNVjpxBDwjctgAXU0-YsFBmFJqo" />
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  
  <style>
    /* Homepage Specific Layout Styles */
    .hero {
      text-align: center;
      padding: 4rem 1rem 3rem;
      max-width: 800px;
      margin: 0 auto;
    }
    .hero p {
      font-size: 1.125rem;
      margin-bottom: 2rem;
    }
    .search-wrapper {
      max-width: 550px;
      margin: 0 auto 3rem;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 0.875rem 1.25rem;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background-color: var(--bg-card);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
      outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .search-input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-light);
    }
    .section-title {
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.25rem;
      margin-bottom: 3.5rem;
    }
    .tool-card {
      display: flex;
      flex-direction: column;
      height: 100%;
      text-decoration: none;
      color: inherit;
    }
    .tool-card-icon {
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
    }
    .tool-card h3 {
      font-size: 1.1rem;
      margin-bottom: 0.35rem;
    }
    .tool-card p {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 0;
      flex: 1;
    }
    .faq-item {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .faq-item h3 {
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }
    .faq-item p {
      margin-bottom: 0;
      font-size: 0.925rem;
    }
  </style>
</head>
<body>

  <!-- Dynamic Header / Navbar Placeholder -->
  <div id="header-container"></div>

  <main class="container">
    <!-- Hero Section -->
    <section class="hero">
      <span class="badge badge-primary" style="margin-bottom: 1rem;">100% Free & Fast</span>
      <h1>Essential Micro-Tools for Digital Creators</h1>
      <p>Clean, private, and ultra-fast web utilities for content, SEO, code, and AI generation.</p>

      <!-- Search Input Container -->
      <div class="search-wrapper">
        <input type="text" id="home-search" class="search-input" placeholder="Search 20+ tools (e.g. Word Counter, JSON, Slug)..." aria-label="Search tools">
        <div id="search-results-dropdown"></div>
      </div>
    </section>

    <!-- Popular Tools Section -->
    <section>
      <div class="section-title">
        <h2>🔥 Popular Tools</h2>
      </div>
      <div class="grid-4" id="popular-tools-grid">
        <!-- Loaded dynamically via JS -->
      </div>
    </section>

    <!-- Categories Section -->
    <section id="categories">
      <div class="section-title">
        <h2>📂 Explore Categories</h2>
      </div>
      <div class="grid-4" id="categories-grid">
        <!-- Loaded dynamically via JS -->
      </div>
    </section>
    <!-- Category Tools Display Section -->
    <section id="category-tools-section" style="display: none; margin-bottom: 3rem;">
      <div class="section-title">
        <h2 id="category-title">Tools</h2>
      </div>
      <div class="grid-4" id="category-tools-grid">
        <!-- Loaded dynamically on category click -->
      </div>
    </section>
    <!-- FAQ Section -->
    <section style="margin-bottom: 4rem;">
      <div class="section-title">
        <h2>❓ Frequently Asked Questions</h2>
      </div>
      <div id="faq-container">
        <!-- Loaded dynamically via JS -->
      </div>
    </section>
  </main>

  <!-- Dynamic Footer Placeholder -->
  <div id="footer-container"></div>

  <!-- Core Scripts -->
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/app.js"></script>

  <!-- Homepage Loader Logic -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        // Fetch Tools & FAQs
        const [toolsRes, catRes, faqRes] = await Promise.all([
          fetch('/data/tools.json'),
          fetch('/data/categories.json'),
          fetch('/data/faqs.json')
        ]);

        const tools = await toolsRes.json();
        const categories = await catRes.json();
        const faqs = await faqRes.json();

        // Render Popular Tools
        const popularGrid = document.getElementById('popular-tools-grid');
        const popularTools = tools.filter(t => t.isPopular);
        popularGrid.innerHTML = popularTools.map(tool => `
          <a href="${tool.url}" class="card card-interactive tool-card">
            <div class="tool-card-icon">${tool.icon}</div>
            <h3>${tool.name}</h3>
            <p>${tool.description}</p>
          </a>
        `).join('');

        // Render Categories
        const catGrid = document.getElementById('categories-grid');
        catGrid.innerHTML = categories.map(cat => `
          <div class="card card-interactive tool-card" onclick="filterCategory('${cat.id}', '${cat.name}')" style="cursor: pointer;">
            <div class="tool-card-icon">${cat.icon}</div>
            <h3>${cat.name}</h3>
            <p>${cat.description}</p>
            <span style="font-size: 0.75rem; color: var(--accent-primary); font-weight: 600; margin-top: 0.75rem; display: block;">View ${cat.count} Tools →</span>
          </div>
        `).join('');

        // Global function to filter tools by category
        window.filterCategory = function(catId, catName) {
          const catSection = document.getElementById('category-tools-section');
          const catTitle = document.getElementById('category-title');
          const catToolsGrid = document.getElementById('category-tools-grid');

          const filteredTools = tools.filter(t => t.category === catId);

          catTitle.textContent = `${catName} (${filteredTools.length})`;
          catToolsGrid.innerHTML = filteredTools.map(tool => `
            <a href="${tool.url}" class="card card-interactive tool-card">
              <div class="tool-card-icon">${tool.icon}</div>
              <h3>${tool.name}</h3>
              <p>${tool.description}</p>
            </a>
          `).join('');

          catSection.style.display = 'block';
          catSection.scrollIntoView({ behavior: 'smooth' });
        };

        // Render FAQs
        const faqGrid = document.getElementById('faq-container');
        faqGrid.innerHTML = faqs.map(faq => `
          <div class="faq-item">
            <h3>${faq.question}</h3>
            <p>${faq.answer}</p>
          </div>
        `).join('');

      } catch (err) {
        console.error('Error loading homepage content:', err);
      }
    });
  </script>
  <!-- Core Scripts -->
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/search.js"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
